[package]
name = "expandrv-agent"
description = "ExpanDrv 사용자 세션 에이전트와 CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "expandrv"
path = "src/main.rs"

[dependencies]
expandrv-core.workspace = true
expandrv-backends = { workspace = true, features = ["webdav", "sftp", "s3", "ftp"] }
expandrv-vfs.workspace = true
expandrv-winfsp.workspace = true
expandrv-ipc.workspace = true
expandrv-log.workspace = true
expandrv-secrets.workspace = true
expandrv-autostart.workspace = true
expandrv-shell.workspace = true
async-trait.workspace = true
clap.workspace = true
futures.workspace = true
serde.workspace = true
serde_json = "1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0"
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
url = "2.5"
winreg = "0.56"
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-subscriber.workspace = true
rpassword = "7.5"
secrecy.workspace = true
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
