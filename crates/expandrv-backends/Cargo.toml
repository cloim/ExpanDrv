[package]
name = "expandrv-backends"
description = "ExpanDrv 스토리지 백엔드(Local, WebDAV, SFTP, S3 호환, FTP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["s3"]
webdav = []
sftp = []
s3 = [
    "dep:rusty-s3",
    "dep:reqwest",
    "dep:quick-xml",
    "dep:serde",
    "dep:jiff",
    "dep:percent-encoding",
    "dep:tokio-util",
    "dep:futures",
]
ftp = []

[dependencies]
expandrv-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
secrecy.workspace = true
tokio.workspace = true
tracing.workspace = true

# S3 호환 백엔드
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"], optional = true }
quick-xml = { version = "0.41", features = ["serialize", "overlapped-lists"], optional = true }
serde = { workspace = true, optional = true }
jiff = { version = "0.2.39", default-features = false, features = ["std"], optional = true }
percent-encoding = { version = "2.3", optional = true }
tokio-util = { version = "0.7.20", features = ["io"], optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
