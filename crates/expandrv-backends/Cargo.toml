[package]
name = "expandrv-backends"
description = "ExpanDrv 스토리지 백엔드(Local, WebDAV, SFTP, S3 호환, FTP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["webdav"]
webdav = [
    "dep:reqwest",
    "dep:rustls",
    "dep:quick-xml",
    "dep:percent-encoding",
    "dep:httpdate",
    "dep:time",
    "dep:sha2",
    "dep:tokio-util",
]
sftp = []
s3 = []
ftp = []

[dependencies]
expandrv-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
secrecy.workspace = true
tokio.workspace = true
tracing.workspace = true

# WebDAV
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
quick-xml = { version = "0.41", optional = true }
percent-encoding = { version = "2.3", optional = true }
httpdate = { version = "1.0", optional = true }
time = { version = "0.3", features = ["parsing"], optional = true }
sha2 = { version = "0.10", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
