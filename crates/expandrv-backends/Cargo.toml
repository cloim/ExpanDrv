[package]
name = "expandrv-backends"
description = "ExpanDrv 스토리지 백엔드(Local, WebDAV, SFTP, S3 호환, FTP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["ftp"]
webdav = []
sftp = []
s3 = []
ftp = [
    "dep:suppaftp",
    "dep:rustls-platform-verifier",
    "dep:encoding_rs",
    "dep:chrono",
]

[dependencies]
expandrv-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
secrecy.workspace = true
tokio.workspace = true
tracing.workspace = true

# FTP/FTPS(ftp 기능)
suppaftp = { version = "12.2", default-features = false, features = ["tokio-rustls-ring", "deprecated"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
encoding_rs = { version = "0.8.35", optional = true }
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
