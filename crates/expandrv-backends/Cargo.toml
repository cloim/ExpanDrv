[package]
name = "expandrv-backends"
description = "ExpanDrv 스토리지 백엔드(Local, WebDAV, SFTP, S3 호환, FTP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["webdav", "sftp", "s3", "ftp"]
webdav = [
    "dep:reqwest",
    "dep:rustls",
    "dep:quick-xml",
    "dep:percent-encoding",
    "dep:httpdate",
    "dep:time",
    "dep:futures",
    "dep:sha2",
    "dep:tokio-util",
]
sftp = [
    "dep:russh",
    "dep:russh-sftp",
    "dep:futures",
    "dep:hmac",
    "dep:sha1",
    "dep:data-encoding",
]
s3 = [
    "dep:rusty-s3",
    "dep:reqwest",
    "dep:rustls",
    "dep:quick-xml",
    "dep:serde",
    "dep:jiff",
    "dep:percent-encoding",
    "dep:tokio-util",
    "dep:futures",
]
ftp = [
    "dep:suppaftp",
    "dep:rustls",
    "dep:sha2",
    "dep:rustls-platform-verifier",
    "dep:encoding_rs",
    "dep:chrono",
]

[dependencies]
expandrv-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
zeroize = "1.8"

# HTTP 공용(WebDAV, S3): rustls만 사용
# 암호 프로바이더는 ring 하나로 통일합니다(SFTP, FTP와 공유, 바이너리 크기와 라이선스 단순화).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "socks"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
quick-xml = { version = "0.41", features = ["serialize", "overlapped-lists"], optional = true }
percent-encoding = { version = "2.3", optional = true }
tokio-util = { version = "0.7.20", features = ["io"], optional = true }
futures = { workspace = true, optional = true }

# WebDAV
httpdate = { version = "1.0", optional = true }
time = { version = "0.3", features = ["parsing"], optional = true }
sha2 = { version = "0.10", optional = true }

# SFTP
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"], optional = true }
russh-sftp = { version = "3.0.1", optional = true }
hmac = { version = "0.13", optional = true }
sha1 = { version = "0.11", optional = true }
data-encoding = { version = "2", optional = true }

# S3 호환
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto"], optional = true }
serde = { workspace = true, optional = true }
jiff = { version = "0.2.39", default-features = false, features = ["std"], optional = true }

# FTP/FTPS(ftp 기능)
suppaftp = { version = "12.2", default-features = false, features = ["tokio-rustls-ring", "deprecated"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
encoding_rs = { version = "0.8.35", optional = true }
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"], optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
