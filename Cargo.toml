[workspace]
resolver = "3"
members = ["crates/*", "gui/src-tauri"]

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
expandrv-core = { path = "crates/expandrv-core" }
expandrv-backends = { path = "crates/expandrv-backends" }
expandrv-vfs = { path = "crates/expandrv-vfs" }
expandrv-secrets = { path = "crates/expandrv-secrets" }
expandrv-winfsp = { path = "crates/expandrv-winfsp" }
expandrv-log = { path = "crates/expandrv-log" }
expandrv-ipc = { path = "crates/expandrv-ipc" }
expandrv-autostart = { path = "crates/expandrv-autostart" }
expandrv-shell = { path = "crates/expandrv-shell" }

async-trait = "0.1.92"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3.34"
parking_lot = "0.13"
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
toml = "1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# 배포 크기 목표(10MB 안팎)에 맞춰 크기 우선으로 최적화하고, 파일 I/O 핫 경로만 속도 최적화를 유지합니다.
# WinFsp 콜백의 패닉을 오류 상태로 바꾸려면 unwind가 필요합니다.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.release.package.expandrv-vfs]
opt-level = 3

[profile.release.package.expandrv-winfsp]
opt-level = 3
